# Sample Fluent Bit output: logs go to Zerobus; tokens come from the broker.
# The broker credentials below are NOT the Databricks service principal.
service:
  flush: 1
  log_level: info
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020
  storage.path: /var/log/flb-storage
  storage.sync: normal
  storage.checksum: off
  storage.backlog.mem_limit: 50M

parsers:
  - name: cri
    format: regex
    regex: '^(?<time>.+?) (?<stream>stdout|stderr) (?<logtag>\S+) (?<message>.*)$'
    time_key: time
    time_format: "%Y-%m-%dT%H:%M:%S.%L%z"

pipeline:
  inputs:
    - name: tail
      tag: kube.*
      path: /var/log/containers/*.log
      parser: cri
      db: /var/log/flb-storage/flb.db
      mem_buf_limit: 50MB
      skip_long_lines: on
      storage.type: filesystem

  filters:
    - name: kubernetes
      match: kube.*
      merge_log: on
      keep_log: off
    - name: grep
      match: kube.*
      exclude: log $kube_namespace_name ^istio-system$

  outputs:
    - name: opentelemetry
      match: kube.*
      host: "${WORKSPACE_ID}.zerobus.${REGION}.cloud.databricks.com"
      port: 443
      grpc: on
      tls: on
      tls.verify: on
      tls.verify_hostname: on
      retry_limit: no_limits

      oauth2.enable: true
      oauth2.token_url: http://zerobus-token.logging.svc.cluster.local:8080/oauth2/token
      oauth2.auth_method: basic
      oauth2.client_id: fluentbit-imaging
      oauth2.client_secret: ${BROKER_CLIENT_SECRET_FLUENTBIT_IMAGING}
      oauth2.refresh_skew_seconds: 120

      header:
        - "x-databricks-zerobus-table-name ${DATABRICKS_LOGS_TABLE}"

      logs_body_key: $message
      logs_body_key_attributes: true
